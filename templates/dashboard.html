<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to right, #141e30, #243b55);
      min-height: 100vh;
      padding: 20px;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #00e5ff;
    }

    .user-info {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .user-info span {
      color: #b0bec5;
      font-size: 14px;
    }

    .logout-btn {
      padding: 10px 20px;
      background: linear-gradient(to right, #d50000, #ff5252);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .logout-btn:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-bottom: 20px;
      color: #00e5ff;
      font-size: 24px;
    }

    .filter-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    input,
    select {
      padding: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      transition: 0.3s;
    }

    input::placeholder {
      color: #b0bec5;
    }

    input:focus,
    select:focus {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid #00e5ff;
    }

    select option {
      background: #243b55;
      color: white;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      margin-top: 5px;
      margin-right: 10px;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    .get-btn {
      background: linear-gradient(to right, #ff9800, #ffb74d);
      color: white;
    }

    .reset-btn {
      background: linear-gradient(to right, #5c6bc0, #7986cb);
      color: white;
    }

    .create-btn {
      background: linear-gradient(to right, #2962ff, #536dfe);
      color: white;
    }

    .update-btn {
      background: linear-gradient(to right, #00897b, #26a69a);
      color: white;
    }

    .delete-btn {
      background: linear-gradient(to right, #d50000, #ff5252);
      color: white;
    }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .student-card {
      background: rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(0, 229, 255, 0.3);
      transition: 0.3s;
    }

    .student-card:hover {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(0, 229, 255, 0.6);
      transform: translateY(-5px);
    }

    .student-card h3 {
      color: #00e5ff;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .student-card p {
      margin: 8px 0;
      color: #b0bec5;
      font-size: 14px;
    }

    .student-card strong {
      color: #ffd54f;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .action-buttons button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
      margin: 0;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      display: none;
    }

    .status.success {
      background: rgba(0, 200, 83, 0.3);
      border: 1px solid #00c853;
      color: #00e676;
      display: block;
    }

    .status.error {
      background: rgba(213, 0, 0, 0.3);
      border: 1px solid #d50000;
      color: #ff5252;
      display: block;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #b0bec5;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .user-info {
        flex-direction: column;
        gap: 10px;
      }

      .header-title {
        font-size: 24px;
      }

      .filter-container {
        grid-template-columns: 1fr;
      }

      .action-buttons {
        flex-direction: column;
      }

      .action-buttons button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div class="header-title">📚 Student Dashboard</div>
      <div class="user-info">
        <span>User Role: <strong id="userRole">Loading...</strong></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- CREATE STUDENT -->
    <div class="card">
      <h2>Create New Student</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
        <input type="number" id="studentId" placeholder="Student ID" />
        <input type="text" id="name" placeholder="Student Name" />
        <input type="text" id="branch" placeholder="Branch" />
        <input type="number" id="age" placeholder="Age" />
        <input type="number" id="marks" placeholder="Marks" />
      </div>
      <button class="create-btn" onclick="createStudent()">Create Student</button>
      <div class="status" id="createStatus"></div>
    </div>

    <!-- VIEW & FILTER STUDENTS -->
    <div class="card">
      <h2>View & Filter Students</h2>

      <!-- FILTER SECTION -->
      <div class="filter-container">
        <input type="text" id="filterName" placeholder="🔍 Filter by Name" />
        <input type="number" id="filterMarksMin" placeholder="Min Marks" />
        <input type="number" id="filterMarksMax" placeholder="Max Marks" />
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="get-btn" onclick="getStudents()">Get All Students</button>
        <button class="reset-btn" onclick="resetFilters()">Reset Filters</button>
      </div>

      <div class="status" id="getStatus"></div>
      <div class="student-grid" id="studentsContainer"></div>
    </div>

    <!-- UPDATE STUDENT -->
    <div class="card">
      <h2>Update Student</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
        <input type="number" id="updateStudentId" placeholder="Student ID" />
        <input type="text" id="updateName" placeholder="Name" />
        <input type="text" id="updateBranch" placeholder="Branch" />
        <input type="number" id="updateAge" placeholder="Age" />
        <input type="number" id="updateMarks" placeholder="Marks" />
      </div>
      <button class="update-btn" onclick="updateStudent()">Update Student</button>
      <div class="status" id="updateStatus"></div>
    </div>

    <!-- DELETE STUDENT -->
    <div class="card">
      <h2>Delete Student</h2>
      <div style="display: flex; gap: 15px;">
        <input type="number" id="deleteId" placeholder="Student ID" style="flex: 1;" />
        <button class="delete-btn" onclick="deleteStudent()" style="margin: 0;">Delete Student</button>
      </div>
      <div class="status" id="deleteStatus"></div>
    </div>
  </div>

  <script>
    const BASE_URL = "http://127.0.0.1:8000";
    let accessToken = "";
    let allStudents = [];

    // INITIALIZE
    function initialize() {
      const urlParams = new URLSearchParams(window.location.search);
      accessToken = urlParams.get('token') || localStorage.getItem('accessToken');

      if (!accessToken) {
        window.location.href = '/';
        return;
      }

      localStorage.setItem('accessToken', accessToken);

      try {
        const payload = JSON.parse(atob(accessToken.split('.')[1]));
        document.getElementById('userRole').textContent = payload.role || 'Unknown';
      } catch (error) {
        console.error('Invalid token');
      }
    }

    // LOGOUT
    function logout() {
      localStorage.removeItem('accessToken');
      window.location.href = '/';
    }

    // CREATE STUDENT
    async function createStudent() {
      const studentId = document.getElementById('studentId').value;
      const name = document.getElementById('name').value.trim();
      const branch = document.getElementById('branch').value.trim();
      const age = document.getElementById('age').value;
      const marks = document.getElementById('marks').value;

      if (!studentId || !name || !branch || !age || !marks) {
        showStatus('createStatus', 'Please fill all fields', 'error');
        return;
      }

      const studentData = {
        name,
        branch,
        age: parseInt(age),
        marks: parseInt(marks)
      };

      try {
        const response = await fetch(`${BASE_URL}/students/${studentId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify(studentData)
        });

        const data = await response.json();

        if (response.ok) {
          showStatus('createStatus', '✓ Student created successfully', 'success');
          document.getElementById('studentId').value = '';
          document.getElementById('name').value = '';
          document.getElementById('branch').value = '';
          document.getElementById('age').value = '';
          document.getElementById('marks').value = '';
          getStudents();
        } else {
          showStatus('createStatus', data.detail || 'Failed to create student', 'error');
        }
      } catch (error) {
        showStatus('createStatus', 'Error: ' + error.message, 'error');
      }
    }

    // GET & FILTER STUDENTS
    async function getStudents() {
      try {
        const response = await fetch(`${BASE_URL}/students`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${accessToken}`
          }
        });

        const data = await response.json();

        if (response.ok) {
          allStudents = Array.isArray(data) ? data : data.students || [];
          applyFilters();
          showStatus('getStatus', `Found ${allStudents.length} student(s)`, 'success');
        } else {
          showStatus('getStatus', data.detail || 'Failed to fetch students', 'error');
        }
      } catch (error) {
        showStatus('getStatus', 'Error: ' + error.message, 'error');
      }
    }

    // APPLY FILTERS
    function applyFilters() {
      const nameFilter = document.getElementById('filterName').value.toLowerCase();
      const minMarks = parseInt(document.getElementById('filterMarksMin').value) || 0;
      const maxMarks = parseInt(document.getElementById('filterMarksMax').value) || Infinity;

      const filtered = allStudents.filter(student => {
        const nameMatch = student.name.toLowerCase().includes(nameFilter);
        const marksMatch = student.marks >= minMarks && student.marks <= maxMarks;
        return nameMatch && marksMatch;
      });

      displayStudents(filtered);
    }

    // DISPLAY STUDENTS
    function displayStudents(students) {
      const container = document.getElementById('studentsContainer');
      container.innerHTML = '';

      if (students.length === 0) {
        container.innerHTML = '<div class="no-results">No students found</div>';
        return;
      }

      students.forEach((student) => {
        container.innerHTML += `
          <div class="student-card">
            <h3>${student.name}</h3>
            <p><strong>ID:</strong> ${student.id}</p>
            <p><strong>Branch:</strong> ${student.branch}</p>
            <p><strong>Age:</strong> ${student.age}</p>
            <p><strong>Marks:</strong> ${student.marks}</p>
          </div>
        `;
      });
    }

    // RESET FILTERS
    function resetFilters() {
      document.getElementById('filterName').value = '';
      document.getElementById('filterMarksMin').value = '';
      document.getElementById('filterMarksMax').value = '';
      applyFilters();
    }

    // UPDATE STUDENT
    async function updateStudent() {
      const studentId = document.getElementById('updateStudentId').value;
      const updateData = {};

      const name = document.getElementById('updateName').value.trim();
      const branch = document.getElementById('updateBranch').value.trim();
      const age = document.getElementById('updateAge').value;
      const marks = document.getElementById('updateMarks').value;

      if (!studentId) {
        showStatus('updateStatus', 'Please enter Student ID', 'error');
        return;
      }

      if (name) updateData.name = name;
      if (branch) updateData.branch = branch;
      if (age) updateData.age = parseInt(age);
      if (marks) updateData.marks = parseInt(marks);

      if (Object.keys(updateData).length === 0) {
        showStatus('updateStatus', 'Please enter at least one field to update', 'error');
        return;
      }

      try {
        const response = await fetch(`${BASE_URL}/students/${studentId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify(updateData)
        });

        const data = await response.json();

        if (response.ok) {
          showStatus('updateStatus', '✓ Student updated successfully', 'success');
          document.getElementById('updateStudentId').value = '';
          document.getElementById('updateName').value = '';
          document.getElementById('updateBranch').value = '';
          document.getElementById('updateAge').value = '';
          document.getElementById('updateMarks').value = '';
          getStudents();
        } else {
          showStatus('updateStatus', data.detail || 'Failed to update student', 'error');
        }
      } catch (error) {
        showStatus('updateStatus', 'Error: ' + error.message, 'error');
      }
    }

    // DELETE STUDENT
    async function deleteStudent() {
      const studentId = document.getElementById('deleteId').value;

      if (!studentId) {
        showStatus('deleteStatus', 'Please enter Student ID', 'error');
        return;
      }

      try {
        const response = await fetch(`${BASE_URL}/students/${studentId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${accessToken}`
          }
        });

        const data = await response.json();

        if (response.ok) {
          showStatus('deleteStatus', '✓ Student deleted successfully', 'success');
          document.getElementById('deleteId').value = '';
          getStudents();
        } else {
          showStatus('deleteStatus', data.detail || 'Failed to delete student', 'error');
        }
      } catch (error) {
        showStatus('deleteStatus', 'Error: ' + error.message, 'error');
      }
    }

    // SHOW STATUS MESSAGE
    function showStatus(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.className = `status ${type}`;
    }

    // ADD FILTER EVENT LISTENERS
    document.addEventListener('DOMContentLoaded', () => {
      initialize();
      document.getElementById('filterName').addEventListener('input', applyFilters);
      document.getElementById('filterMarksMin').addEventListener('input', applyFilters);
      document.getElementById('filterMarksMax').addEventListener('input', applyFilters);
    });
  </script>
</body>

</html>
